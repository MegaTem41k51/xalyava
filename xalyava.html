<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATEM41K vs Sergo Bulkin</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #1e1e2e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        color: #fff;
    }

    h1 { margin-bottom: 20px; font-size: 24px; text-align: center; }

    /* ===== ГЛАВНЫЕ ВКЛАДКИ ===== */
    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        background: #2a2a3e;
        padding: 6px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .tab-btn {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #aaa;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }

    .tab-btn:hover { color: #fff; background: #35354d; }

    .tab-btn.active {
        background: #764ba2;
        color: #fff;
        box-shadow: 0 4px 12px rgba(118, 75, 162, 0.5);
    }

    .tab-content {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: center;
    }

    .tab-content.active { display: flex; }

    /* ===== КНОПКИ ===== */
    .toolbar {
        margin-bottom: 15px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #764ba2;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    button:hover { background: #5a3a7d; }
    button.danger { background: #c62828; }
    button.danger:hover { background: #9b1f1f; }

    /* ===== ТАБЛИЦА УЧЁТА ===== */
    table.acc-table {
        border-collapse: collapse;
        background: #2a2a3e;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        overflow: hidden;
    }

    table.acc-table th,
    table.acc-table td {
        border: 1px solid #444;
        padding: 10px 12px;
        min-width: 180px;
        height: 60px;
        vertical-align: top;
        position: relative;
    }

    table.acc-table th {
        background: #764ba2;
        color: #fff;
        font-weight: 700;
        text-align: center;
        font-size: 15px;
    }

    table.acc-table th:first-child { background: #5a3a7d; }

    table.acc-table td:first-child {
        background: #3a3a52;
        font-weight: 700;
        color: #fff;
        text-align: center;
        vertical-align: middle;
        font-size: 15px;
        min-width: 110px;
    }

    table.acc-table td[contenteditable="true"] {
        outline: none;
        cursor: text;
        font-size: 14px;
        color: #e0e0e0;
        white-space: pre-wrap;
        transition: background 0.15s;
    }

    table.acc-table td[contenteditable="true"]:hover { background: #35354d; }

    table.acc-table td[contenteditable="true"]:focus {
        background: #3d3d5c;
        box-shadow: inset 0 0 0 2px #a78bfa;
    }

    table.acc-table td[contenteditable="true"]:empty::before {
        content: attr(data-placeholder);
        color: #666;
        font-style: italic;
        font-size: 12px;
    }

    tr { position: relative; }

    .row-delete {
        position: absolute;
        left: -30px;
        top: 50%;
        transform: translateY(-50%);
        background: #c62828;
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition: 0.2s;
        padding: 0;
        z-index: 10;
    }
    tr:hover .row-delete { opacity: 1; }
    .row-delete:hover { background: #9b1f1f; }

    /* ===== КАЛЕНДАРЬ ===== */
    .player-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        background: #2a2a3e;
        padding: 6px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .player-btn {
        padding: 12px 28px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #aaa;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .player-btn:hover { color: #fff; background: #35354d; }

    .player-btn.active.mega {
        background: linear-gradient(135deg, #ff6b6b, #c62828);
        color: #fff;
        box-shadow: 0 4px 15px rgba(198, 40, 40, 0.5);
    }

    .player-btn.active.sergo {
        background: linear-gradient(135deg, #4fc3f7, #0288d1);
        color: #fff;
        box-shadow: 0 4px 15px rgba(2, 136, 209, 0.5);
    }

    .player-btn .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff6b6b;
    }

    .player-btn.sergo .dot { background: #4fc3f7; }

    .player-view {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .player-view.active { display: flex; }

    .cal-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        background: #2a2a3e;
        padding: 12px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .cal-header button {
        padding: 8px 14px;
        font-size: 18px;
        background: #5a3a7d;
    }

    .cal-header button:hover { background: #764ba2; }

    .cal-title {
        font-size: 20px;
        font-weight: 700;
        min-width: 220px;
        text-align: center;
        color: #fff;
    }

    .calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        width: 100%;
        max-width: 1100px;
    }

    .cal-dayname {
        text-align: center;
        font-weight: 700;
        color: #a78bfa;
        padding: 8px 0;
        font-size: 14px;
        text-transform: uppercase;
    }

    .cal-cell {
        background: #2a2a3e;
        border-radius: 10px;
        padding: 8px;
        min-height: 220px;
        border: 1px solid #3a3a52;
        display: flex;
        flex-direction: column;
        transition: 0.2s;
    }

    .cal-cell:hover { border-color: #764ba2; }
    .cal-cell.empty { background: transparent; border: none; }
    .cal-cell.today { border: 2px solid #a78bfa; box-shadow: 0 0 15px rgba(167,139,250,0.4); }

    .cal-date {
        font-size: 14px;
        font-weight: 700;
        color: #a78bfa;
        margin-bottom: 6px;
        text-align: right;
    }

    .cal-cell.today .cal-date {
        color: #fff;
        background: #764ba2;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        line-height: 26px;
        text-align: center;
        align-self: flex-end;
    }

    /* ===== БЛОК ИМЕНИ И СКИНА (как на скрине) ===== */
    .cal-person {
        background: #35354d;
        border-radius: 8px;
        padding: 6px;
        margin-bottom: 6px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .cal-person:last-child { margin-bottom: 0; }

    .cal-person-name {
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 4px;
        text-align: center;
    }

    .cal-person-name.alik { color: #4fc3f7; }
    .cal-person-name.zhidkiy { color: #81c784; }

    .skin-box {
        flex: 1;
        background: #1e1e2e;
        border: 1px dashed #555;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        min-height: 60px;
        transition: 0.2s;
    }

    .skin-box:hover { border-color: #a78bfa; background: #25253a; }

    .skin-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
    }

    .skin-box .placeholder {
        font-size: 10px;
        color: #666;
        text-align: center;
        padding: 4px;
        pointer-events: none;
    }

    .skin-box input[type="file"] {
        display: none;
    }

    .skin-remove {
        position: absolute;
        top: 2px;
        right: 2px;
        background: #c62828;
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
        z-index: 5;
        display: none;
    }

    .skin-box.has-image .skin-remove { display: block; }

    /* ===== ПОДСКАЗКА ===== */
    .hint {
        margin-top: 20px;
        color: #888;
        font-size: 13px;
        text-align: center;
        max-width: 700px;
        line-height: 1.6;
    }

    /* ===== МОДАЛКА ===== */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal.active { display: flex; }

    .modal img {
        max-width: 90vw;
        max-height: 90vh;
        border-radius: 12px;
        box-shadow: 0 0 40px rgba(167,139,250,0.5);
    }

    .modal-close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 36px;
        color: #fff;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
        line-height: 1;
    }

    .modal-close:hover { color: #a78bfa; }
</style>
</head>
<body>

<h1>MEGATEM41K vs Sergo Bulkin</h1>

<!-- ===== ГЛАВНЫЕ ВКЛАДКИ ===== -->
<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('accounting', this)">📊 Учёт халявы</button>
    <button class="tab-btn" onclick="switchTab('calendar', this)">📅 Календарь скинов</button>
</div>

<!-- ===== ВКЛАДКА 1: УЧЁТ ===== -->
<div id="tab-accounting" class="tab-content active">
    <div class="toolbar">
        <button onclick="addRow()">➕ Добавить день</button>
        <button onclick="addCol()">➕ Добавить человека</button>
        <button class="danger" onclick="clearTable()">🗑 Очистить всё</button>
    </div>

    <table id="myTable" class="acc-table">
        <thead>
            <tr>
                <th>День / Кто</th>
                <th contenteditable="true">Я</th>
                <th contenteditable="true">Серго</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Пн</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
            <tr>
                <td>Вт</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
            <tr>
                <td>Ср</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
            <tr>
                <td>Чт</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
            <tr>
                <td>Пт</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
            <tr>
                <td>Сб</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
            <tr>
                <td>Вс</td>
                <td contenteditable="true" data-placeholder="сумма"></td>
                <td contenteditable="true" data-placeholder="сумма"></td>
            </tr>
        </tbody>
    </table>

    <p class="hint">👆 Кликай на ячейку и пиши сумму. Всё сохраняется автоматически.</p>
</div>

<!-- ===== ВКЛАДКА 2: КАЛЕНДАРЬ ===== -->
<div id="tab-calendar" class="tab-content">

    <!-- Вкладки игроков -->
    <div class="player-tabs">
        <button class="player-btn mega active" onclick="switchPlayer('mega', this)">
            <span class="dot"></span> MEGATEM41K
        </button>
        <button class="player-btn sergo" onclick="switchPlayer('sergo', this)">
            <span class="dot"></span> Sergo Bulkin
        </button>
    </div>

    <!-- Календарь MEGATEM41K -->
    <div id="player-mega" class="player-view active">
        <div class="cal-header">
            <button onclick="changeMonth('mega', -1)">◀</button>
            <div class="cal-title" id="calTitle-mega"></div>
            <button onclick="changeMonth('mega', 1)">▶</button>
        </div>
        <div class="calendar" id="calendar-mega"></div>
    </div>

    <!-- Календарь Sergo Bulkin -->
    <div id="player-sergo" class="player-view">
        <div class="cal-header">
            <button onclick="changeMonth('sergo', -1)">◀</button>
            <div class="cal-title" id="calTitle-sergo"></div>
            <button onclick="changeMonth('sergo', 1)">▶</button>
        </div>
        <div class="calendar" id="calendar-sergo"></div>
    </div>

    <p class="hint">
        📸 Кликни на квадрат под <b>Аликом</b> или <b>Жидким</b> — загрузится PNG или JPG.<br>
        У <b>MEGATEM41K</b> и <b>Sergo Bulkin</b> — отдельные календари и отдельные скины.
    </p>
</div>

<!-- ===== МОДАЛКА ===== -->
<div class="modal" id="modal" onclick="closeModal(event)">
    <button class="modal-close" onclick="closeModal(event)">×</button>
    <img id="modalImg" src="" alt="">
</div>

<script>
    // ==================================================
    // ===== ГЛАВНЫЕ ВКЛАДКИ =====
    // ==================================================
    function switchTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    // ==================================================
    // ===== УЧЁТ ХАЛЯВЫ =====
    // ==================================================
    const STORAGE_KEY = 'halyava_table_v2';

    function saveTable() {
        const table = document.getElementById('myTable');
        const data = { head: [], body: [] };

        table.querySelectorAll('thead th').forEach(th => data.head.push(th.innerText));
        table.querySelectorAll('tbody tr').forEach(tr => {
            const row = [];
            tr.querySelectorAll('td').forEach(td => row.push(td.innerText));
            data.body.push(row);
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadTable() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;

        try {
            const data = JSON.parse(saved);
            const table = document.getElementById('myTable');

            const thead = table.querySelector('thead tr');
            thead.innerHTML = '';
            data.head.forEach((text, i) => {
                const th = document.createElement('th');
                th.innerText = text;
                if (i > 0) th.contentEditable = "true";
                thead.appendChild(th);
            });

            const tbody = table.querySelector('tbody');
            tbody.innerHTML = '';
            data.body.forEach(rowData => {
                const tr = document.createElement('tr');
                rowData.forEach((text, i) => {
                    const td = document.createElement('td');
                    if (i === 0) {
                        td.innerText = text;
                    } else {
                        td.contentEditable = "true";
                        td.setAttribute('data-placeholder', 'сумма');
                        td.innerText = text;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.warn('Ошибка загрузки', e);
        }
    }

    function addRow() {
        const tbody = document.getElementById('myTable').querySelector('tbody');
        const cols = tbody.rows[0].cells.length;
        const tr = document.createElement('tr');

        const firstTd = document.createElement('td');
        firstTd.contentEditable = "true";
        firstTd.innerText = 'Новый день';
        tr.appendChild(firstTd);

        for (let i = 1; i < cols; i++) {
            const td = document.createElement('td');
            td.contentEditable = "true";
            td.setAttribute('data-placeholder', 'сумма');
            tr.appendChild(td);
        }

        tbody.appendChild(tr);
        saveTable();
    }

    function addCol() {
        const table = document.getElementById('myTable');

        const th = document.createElement('th');
        th.contentEditable = "true";
        th.innerText = 'Новый';
        table.querySelector('thead tr').appendChild(th);

        table.querySelectorAll('tbody tr').forEach(tr => {
            const td = document.createElement('td');
            td.contentEditable = "true";
            td.setAttribute('data-placeholder', 'сумма');
            tr.appendChild(td);
        });

        saveTable();
    }

    function clearTable() {
        if (!confirm("Точно очистить все данные?")) return;
        document.querySelectorAll('#myTable tbody [contenteditable="true"]')
            .forEach(c => c.innerText = '');
        saveTable();
    }

    function attachDeleteButtons() {
        document.querySelectorAll('#myTable tbody tr').forEach(tr => {
            if (tr.querySelector('.row-delete')) return;

            const btn = document.createElement('button');
            btn.className = 'row-delete';
            btn.innerHTML = '×';
            btn.title = 'Удалить строку';
            btn.onclick = (e) => {
                e.stopPropagation();
                tr.remove();
                saveTable();
            };

            tr.appendChild(btn);
        });
    }

    // ==================================================
    // ===== КАЛЕНДАРЬ =====
    // ==================================================
    const SKIN_STORAGE_KEY = 'skins_v3';

    // Структура:
    // {
    //   mega:  { "2025-01-15": { alik: "data:image...", zhidkiy: "data:image..." } },
    //   sergo: { "2025-01-15": { alik: "data:image...", zhidkiy: "data:image..." } }
    // }
    let skins = { mega: {}, sergo: {} };

    let currentDate = {
        mega: new Date(),
        sergo: new Date()
    };
    currentDate.mega.setDate(1);
    currentDate.sergo.setDate(1);

    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                    'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

    function switchPlayer(playerKey, btn) {
        document.querySelectorAll('.player-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));

        document.getElementById('player-' + playerKey).classList.add('active');
        btn.classList.add('active');
    }

    function loadSkins() {
        const saved = localStorage.getItem(SKIN_STORAGE_KEY);
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                skins.mega = parsed.mega || {};
                skins.sergo = parsed.sergo || {};
            } catch(e) {
                skins = { mega: {}, sergo: {} };
            }
        }
    }

    function saveSkins() {
        try {
            localStorage.setItem(SKIN_STORAGE_KEY, JSON.stringify(skins));
        } catch(e) {
            alert('Не хватило места в хранилище. Удали старые картинки.');
        }
    }

    function dateKey(y, m, d) {
        return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    function renderCalendar(playerKey) {
        const y = currentDate[playerKey].getFullYear();
        const m = currentDate[playerKey].getMonth();

        document.getElementById('calTitle-' + playerKey).innerText = `${MONTHS[m]} ${y}`;

        const cal = document.getElementById('calendar-' + playerKey);
        cal.innerHTML = '';

        // Дни недели
        DAYS.forEach(d => {
            const el = document.createElement('div');
            el.className = 'cal-dayname';
            el.innerText = d;
            cal.appendChild(el);
        });

        let firstDay = new Date(y, m, 1).getDay();
        firstDay = (firstDay === 0) ? 6 : firstDay - 1;

        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'cal-cell empty';
            cal.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell';

            if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) {
                cell.classList.add('today');
            }

            const dateEl = document.createElement('div');
            dateEl.className = 'cal-date';
            dateEl.innerText = d;
            cell.appendChild(dateEl);

            const key = dateKey(y, m, d);

            // Блок Алика
            cell.appendChild(createPersonBlock(playerKey, 'alik', 'Алик', key));
            // Блок Жидкого
            cell.appendChild(createPersonBlock(playerKey, 'zhidkiy', 'Жидкий', key));

            cal.appendChild(cell);
        }
    }

    function createPersonBlock(playerKey, personKey, personName, dateKeyStr) {
        const wrap = document.createElement('div');
        wrap.className = 'cal-person';

        const nameEl = document.createElement('div');
        nameEl.className = 'cal-person-name ' + personKey;
        nameEl.innerText = personName;
        wrap.appendChild(nameEl);

        const box = document.createElement('div');
        box.className = 'skin-box';

        const imgSrc = skins[playerKey][dateKeyStr] && skins[playerKey][dateKeyStr][personKey];

        if (imgSrc) {
            box.classList.add('has-image');

            const img = document.createElement('img');
            img.src = imgSrc;
            img.onclick = (e) => {
                e.stopPropagation();
                openModal(img.src);
            };
            box.appendChild(img);

            const removeBtn = document.createElement('button');
            removeBtn.className = 'skin-remove';
            removeBtn.innerHTML = '×';
            removeBtn.title = 'Удалить скин';
            removeBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm('Удалить скин?')) {
                    delete skins[playerKey][dateKeyStr][personKey];
                    if (Object.keys(skins[playerKey][dateKeyStr]).length === 0) {
                        delete skins[playerKey][dateKeyStr];
                    }
                    saveSkins();
                    renderCalendar(playerKey);
                }
            };
            box.appendChild(removeBtn);
        } else {
            const ph = document.createElement('div');
            ph.className = 'placeholder';
            ph.innerText = '+ скин';
            box.appendChild(ph);
        }

        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/png, image/jpeg, image/jpg, image/webp';
        input.onchange = (e) => handleFileUpload(e, playerKey, personKey, dateKeyStr);
        box.appendChild(input);

        box.onclick = (e) => {
            if (e.target.tagName === 'IMG' || e.target.classList.contains('skin-remove')) return;
            input.click();
        };

        wrap.appendChild(box);
        return wrap;
    }

    function handleFileUpload(event, playerKey, personKey, dateKeyStr) {
        const file = event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert('Только картинки (PNG, JPG)');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            if (!skins[playerKey][dateKeyStr]) skins[playerKey][dateKeyStr] = {};
            skins[playerKey][dateKeyStr][personKey] = e.target.result;
            saveSkins();
            renderCalendar(playerKey);
        };
        reader.readAsDataURL(file);
    }

    function changeMonth(playerKey, delta) {
        currentDate[playerKey].setMonth(currentDate[playerKey].getMonth() + delta);
        renderCalendar(playerKey);
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('modal').classList.add('active');
    }

    function closeModal(e) {
        if (e) e.stopPropagation();
        document.getElementById('modal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // ==================================================
    // ===== ИНИЦИАЛИЗАЦИЯ =====
    // ==================================================
    loadTable();
    attachDeleteButtons();
    loadSkins();
    renderCalendar('mega');
    renderCalendar('sergo');

    document.getElementById('myTable').addEventListener('input', saveTable);

    const observer = new MutationObserver(() => attachDeleteButtons());
    observer.observe(document.getElementById('myTable').querySelector('tbody'), {
        childList: true
    });
</script>

</body>
</html>
