<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATEM41K vs Sergo Bulkin</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #1e1e2e;
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center;
        padding: 20px; color: #fff;
    }
    h1 { margin-bottom: 20px; font-size: 24px; text-align: center; }

    * { scrollbar-width: thin; scrollbar-color: #764ba2 #2a2a3e; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: #2a2a3e; }
    *::-webkit-scrollbar-thumb { background: #764ba2; border-radius: 5px; }

    .login-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.95);
        z-index: 2000;
        display: flex; justify-content: center; align-items: center;
        padding: 20px;
    }
    .login-overlay.hidden { display: none !important; }
    .login-box {
        background: #2a2a3e; border-radius: 16px;
        padding: 40px; width: 100%; max-width: 400px;
        text-align: center;
    }
    .login-box h2 { font-size: 22px; margin-bottom: 8px; }
    .login-box p { color: #888; font-size: 14px; margin-bottom: 25px; }
    .login-box input {
        width: 100%; padding: 14px 16px; margin-bottom: 12px;
        border: 1px solid #444; border-radius: 8px;
        background: #1e1e2e; color: #fff; font-size: 15px; outline: none;
    }
    .login-box input:focus { border-color: #a78bfa; }
    .login-box button {
        width: 100%; padding: 14px;
        background: #764ba2; border: none; border-radius: 8px;
        color: #fff; font-size: 15px; font-weight: 700;
        cursor: pointer; margin-top: 8px;
    }
    .login-box button:hover { background: #5a3a7d; }
    .login-error { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 18px; }

    .user-bar {
        display: flex; align-items: center; gap: 12px;
        background: #2a2a3e; padding: 8px 16px;
        border-radius: 10px; margin-bottom: 15px; font-size: 14px;
    }
    .user-bar .avatar {
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 14px; color: #fff;
        background-size: cover; background-position: center;
        flex-shrink: 0; overflow: hidden;
    }
    .user-bar .avatar.mega { background: linear-gradient(135deg, #ff6b6b, #c62828); }
    .user-bar .avatar.sergo { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
    .user-bar .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-bar .logout {
        padding: 5px 12px; font-size: 12px;
        background: #c62828; border-radius: 6px;
    }

    .tabs {
        display: flex; gap: 8px; margin-bottom: 20px;
        background: #2a2a3e; padding: 6px;
        border-radius: 12px; flex-wrap: wrap; justify-content: center;
    }
    .tab-btn {
        padding: 10px 20px; border: none; border-radius: 8px;
        background: transparent; color: #aaa;
        font-size: 14px; font-weight: 600;
        cursor: pointer; transition: 0.2s;
    }
    .tab-btn:hover { color: #fff; background: #35354d; }
    .tab-btn.active { background: #764ba2; color: #fff; }
    .tab-btn.admin-tab { background: linear-gradient(135deg, #f9a825, #f57c00); color: #000; }
    .tab-btn.admin-tab.active { background: linear-gradient(135deg, #ffb300, #f57c00); color: #000; }
    .tab-btn.auction-tab { background: linear-gradient(135deg, #ff3d3d, #a00000); color: #fff; }
    .tab-btn.auction-tab.active { background: linear-gradient(135deg, #ff5555, #c00000); color: #fff; }

    .tab-content {
        display: none; width: 100%;
        flex-direction: column; align-items: center;
    }
    .tab-content.active { display: flex; }

    button {
        padding: 10px 18px; border: none; border-radius: 8px;
        background: #764ba2; color: #fff;
        font-size: 14px; font-weight: 600;
        cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #5a3a7d; }

    table.acc-table {
        border-collapse: collapse;
        background: #2a2a3e;
        border-radius: 8px; overflow: hidden;
    }
    table.acc-table th, table.acc-table td {
        border: 1px solid #444;
        padding: 12px 16px;
        min-width: 220px;
        font-size: 15px;
    }
    table.acc-table th { text-align: center; padding: 16px 12px; }
    table.acc-table th:first-child { background: #5a3a7d; min-width: 100px; }
    table.acc-table th[data-owner="mega"] { background: linear-gradient(135deg, #ff6b6b, #c62828); }
    table.acc-table th[data-owner="sergo"] { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
    table.acc-table td:first-child {
        background: #3a3a52; font-weight: 700;
        text-align: center; min-width: 100px;
    }

    .cell-pair { display: flex; flex-direction: column; gap: 6px; }
    .cell-row { display: flex; align-items: center; gap: 6px; }
    .cell-row .label { font-weight: 700; font-size: 14px; white-space: nowrap; min-width: 60px; }
    .cell-row .label.alik { color: #4fc3f7; }
    .cell-row .label.zhidkiy { color: #81c784; }

    .price-input {
        flex: 1; background: #1e1e2e; border: 1px solid #444;
        outline: none; color: #fff; font-size: 15px; font-weight: 600;
        padding: 6px 10px; border-radius: 6px; min-width: 60px;
    }
    .price-input:focus { border-color: #a78bfa; }
    .price-input:disabled { color: #e0e0e0; cursor: not-allowed; background: #23233a; }

    tr.total-row td { border-top: 3px solid #f9a825; padding: 16px; }
    tr.total-row td:first-child { background: #4a3a6b !important; font-size: 16px; }
    .total-value { font-size: 22px; font-weight: 800; color: #f9a825; display: block; text-align: center; }
    .total-value.mega { color: #ff6b6b; }
    .total-value.sergo { color: #4fc3f7; }

    /* ДРОПЫ */
    .drops-header {
        display: flex; justify-content: space-between; align-items: center;
        width: 100%; max-width: 1100px;
        margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .drops-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .drops-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .drops-filter-btn {
        padding: 8px 16px; background: #2a2a3e; color: #aaa;
        border: 1px solid #3a3a52; border-radius: 8px;
        font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .drops-filter-btn:hover { color: #fff; border-color: #764ba2; }
    .drops-filter-btn.active { background: #764ba2; color: #fff; border-color: #764ba2; }

    .drops-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 16px; width: 100%; max-width: 1100px;
    }

    .drop-card {
        background: #2a2a3e; border-radius: 12px; overflow: hidden;
        border: 2px solid #3a3a52; transition: 0.25s;
        position: relative; display: flex; flex-direction: column; cursor: pointer;
    }
    .drop-card:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0,0,0,0.6); }
    .drop-card.rarity-shirotreb { border-color: #5a5a7a; }
    .drop-card.rarity-prom { border-color: #4a90e2; }
    .drop-card.rarity-army { border-color: #5b8dd6; }
    .drop-card.rarity-forbidden { border-color: #9b59b6; }
    .drop-card.rarity-classified { border-color: #e91e63; }
    .drop-card.rarity-secret { border-color: #c62828; box-shadow: 0 0 20px rgba(198,40,40,0.35); }
    .drop-card.rarity-gold { border-color: #f9a825; box-shadow: 0 0 25px rgba(249,168,37,0.5); }

    .drop-image {
        width: 100%; height: 140px; background: #1e1e2e;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; position: relative;
    }
    .drop-image .no-image { font-size: 50px; opacity: 0.3; }

    .drop-rarity-badge {
        position: absolute; top: 8px; right: 8px;
        padding: 3px 10px; border-radius: 12px;
        font-size: 10px; font-weight: 800; text-transform: uppercase;
        color: #fff; z-index: 5;
    }
    .rarity-shirotreb .drop-rarity-badge { background: #5a5a7a; }
    .rarity-prom .drop-rarity-badge { background: #4a90e2; }
    .rarity-army .drop-rarity-badge { background: #5b8dd6; }
    .rarity-forbidden .drop-rarity-badge { background: #9b59b6; }
    .rarity-classified .drop-rarity-badge { background: #e91e63; }
    .rarity-secret .drop-rarity-badge { background: #c62828; }
    .rarity-gold .drop-rarity-badge { background: #f9a825; color: #000; }

    .drop-info {
        padding: 12px 14px; flex: 1;
        display: flex; flex-direction: column; gap: 6px;
    }
    .drop-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .drop-case { font-size: 12px; color: #a78bfa; }
    .drop-giver { font-size: 12px; color: #f9a825; font-weight: 700; }
    .drop-price { font-size: 16px; font-weight: 800; color: #81c784; margin-top: auto; }
    .drop-date { font-size: 11px; color: #666; }
    .drop-author { font-size: 11px; color: #888; font-style: italic; }

    .drops-empty {
        text-align: center; padding: 60px 20px;
        color: #666; font-size: 15px;
        width: 100%; grid-column: 1 / -1;
    }

    /* АУКЦИОН */
    .auction-wrap {
        width: 100%; max-width: 1200px;
        display: flex; flex-direction: column; gap: 20px;
    }
    .auction-header {
        background: linear-gradient(135deg, #2a0a0a, #1a0a1a);
        border: 2px solid #a00000; border-radius: 16px; padding: 24px;
    }
    .auction-header h2 {
        font-size: 28px; letter-spacing: 2px;
        text-transform: uppercase; font-weight: 900;
    }
    .auction-header p { color: #888; font-size: 13px; margin-top: 4px; }

    .auction-main {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 20px; align-items: start;
    }
    @media (max-width: 900px) { .auction-main { grid-template-columns: 1fr; } }

    .auction-info {
        background: #2a2a3e; border-radius: 14px;
        padding: 20px; display: flex; flex-direction: column; gap: 16px;
        border: 1px solid #3a3a52;
    }
    .auction-org { display: flex; align-items: center; gap: 14px; }
    .auction-org .org-avatar {
        width: 60px; height: 60px; border-radius: 50%;
        background: linear-gradient(135deg, #ff6b6b, #c62828);
        display: flex; align-items: center; justify-content: center;
        font-size: 24px; font-weight: 900; overflow: hidden;
    }
    .auction-org .org-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .auction-org .org-info h3 { font-size: 18px; }
    .auction-org .org-info p { color: #888; font-size: 12px; }

    .auction-timer { margin-left: auto; text-align: right; display: none; }
    .auction-timer.visible { display: block; }
    .auction-timer .timer-label {
        font-size: 11px; color: #888;
        text-transform: uppercase;
    }
    .auction-timer .timer-value {
        font-size: 20px; font-weight: 800;
        font-variant-numeric: tabular-nums;
    }
    .auction-timer .timer-value.running { color: #4ade80; }
    .auction-timer .timer-value.finished { color: #ffd700; font-size: 15px; }

    .auction-price {
        background: linear-gradient(135deg, #2a0a0a, #1a0a1a);
        border: 1px solid #a00000; border-radius: 12px;
        padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .auction-price .price-left { display: flex; flex-direction: column; }
    .auction-price .price-val { color: #ff4444; font-size: 22px; font-weight: 900; }
    .auction-price .price-sub { color: #888; font-size: 12px; }
    .auction-price .dep-btn {
        background: linear-gradient(135deg, #f9a825, #f57c00);
        color: #000; font-size: 14px; font-weight: 800;
        padding: 12px 24px; border: none; border-radius: 8px;
        cursor: pointer; text-transform: uppercase;
    }
    .auction-price .dep-btn:hover {
        background: linear-gradient(135deg, #ffb300, #f57c00);
        transform: scale(1.05);
    }
    .auction-price .dep-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .prizes-title {
        color: #fff; font-size: 14px; font-weight: 700;
        text-transform: uppercase;
    }
    .auction-prizes {
        display: flex; flex-direction: column; gap: 8px;
        max-height: 400px; overflow-y: auto;
    }
    .auction-prize {
        background: #23233a; border-radius: 8px;
        padding: 10px 14px; display: flex;
        justify-content: space-between; align-items: center;
        border-left: 3px solid #a00000; gap: 10px;
    }
    .auction-prize .prize-info { flex: 1; }
    .auction-prize .prize-name { font-size: 13px; font-weight: 600; }
    .auction-prize .prize-chance { font-size: 11px; color: #888; margin-top: 2px; }
    .auction-prize .prize-price { color: #4ade80; font-weight: 700; font-size: 14px; white-space: nowrap; }

    .auction-tickets {
        background: #2a2a3e; border-radius: 14px;
        padding: 20px; border: 1px solid #3a3a52;
    }
    .tickets-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .tickets-header h3 { font-size: 16px; text-transform: uppercase; }
    .tickets-count {
        color: #ff4444; font-weight: 800;
        font-size: 18px; font-variant-numeric: tabular-nums;
    }

    .tickets-counters {
        display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .counter-badge {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 14px; border-radius: 8px;
        font-size: 14px; font-weight: 700;
    }
    .counter-badge.mega {
        background: rgba(198,40,40,0.2);
        border: 1px solid #c62828;
        color: #ff8888;
    }
    .counter-badge.sergo {
        background: rgba(2,136,209,0.2);
        border: 1px solid #0288d1;
        color: #88ccff;
    }
    .counter-badge .cnt { font-size: 18px; font-variant-numeric: tabular-nums; }

    .tickets-grid {
        display: grid;
        grid-template-columns: repeat(30, 1fr);
        gap: 1px;
        background: #1a1a2a;
        padding: 4px; border-radius: 6px;
        max-height: 420px; overflow-y: auto;
    }
    .ticket-cell {
        aspect-ratio: 1;
        background: #2f2f44;
        transition: 0.1s;
    }

    .ticket-cell.c0  { background: #4ade80; }
    .ticket-cell.c1  { background: #f87171; }
    .ticket-cell.c2  { background: #fbbf24; }
    .ticket-cell.c3  { background: #a78bfa; }
    .ticket-cell.c4  { background: #60a5fa; }
    .ticket-cell.c5  { background: #f472b6; }
    .ticket-cell.c6  { background: #34d399; }
    .ticket-cell.c7  { background: #fb923c; }
    .ticket-cell.c8  { background: #c084fc; }
    .ticket-cell.c9  { background: #22d3ee; }
    .ticket-cell.c10 { background: #a3e635; }
    .ticket-cell.c11 { background: #e879f9; }
    .ticket-cell.c12 { background: #facc15; }
    .ticket-cell.c13 { background: #38bdf8; }
    .ticket-cell.c14 { background: #fb7185; }
    .ticket-cell.c15 { background: #86efac; }

    .ticket-cell.runner {
        background: rgba(255,255,255,0.95) !important;
        box-shadow: 0 0 8px rgba(255,255,255,0.9), 0 0 16px rgba(167,139,250,0.9);
        z-index: 2;
    }

    .tickets-status {
        margin-top: 14px; text-align: center;
        font-size: 14px; color: #888; min-height: 20px;
    }
    .tickets-status.win { color: #4ade80; font-weight: 800; font-size: 18px; }

    .winner-block {
        margin-top: 20px;
        display: none;
        flex-direction: column; align-items: center; gap: 12px;
        background: linear-gradient(135deg, #2a0a0a, #1a0a1a);
        border: 2px solid #f9a825;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 0 30px rgba(249,168,37,0.4);
        animation: winnerPop 0.5s ease;
    }
    .winner-block.visible { display: flex; }
    @keyframes winnerPop {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .winner-block .winner-title {
        color: #f9a825; font-size: 18px; font-weight: 900;
        text-transform: uppercase;
    }
    .winner-block .winner-content {
        display: flex; flex-direction: column; align-items: center;
        gap: 8px;
        background: #1a1a2a;
        border-radius: 12px;
        padding: 18px 28px;
    }
    .winner-block .winner-skin-name {
        font-size: 18px; font-weight: 700; color: #fff;
        text-align: center;
    }
    .winner-block .winner-skin-price {
        font-size: 14px; color: #4ade80; font-weight: 700;
    }
    .winner-block .winner-nick {
        font-size: 22px; font-weight: 900;
        color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5);
    }

    /* АДМИНКА */
    .admin-wrap {
        width: 100%; max-width: 900px;
        display: flex; flex-direction: column; gap: 20px;
    }
    .admin-card {
        background: #2a2a3e; border-radius: 14px;
        padding: 24px; border: 1px solid #3a3a52;
    }
    .admin-card h3 {
        font-size: 17px; margin-bottom: 16px; color: #f9a825;
    }
    .admin-card h3.mega-color { color: #ff6b6b; }
    .admin-card h3.sergo-color { color: #4fc3f7; }

    .admin-field {
        display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px;
    }
    .admin-field label { font-size: 13px; color: #888; font-weight: 600; }
    .admin-field input, .admin-field select, .admin-field textarea {
        padding: 10px 14px; border: 1px solid #444;
        border-radius: 8px; background: #1e1e2e;
        color: #fff; font-size: 14px; outline: none;
    }
    .admin-field textarea { font-family: monospace; font-size: 12px; min-height: 220px; resize: vertical; }
    .admin-field select { cursor: pointer; }

    .admin-btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .admin-btn {
        padding: 10px 18px; background: #764ba2; color: #fff;
        border: none; border-radius: 8px;
        font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .admin-btn:hover { background: #5a3a7d; }
    .admin-btn.danger { background: #c62828; }
    .admin-btn.small { padding: 6px 12px; font-size: 12px; }

    .admin-msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
    .admin-msg.ok { color: #81c784; }
    .admin-msg.err { color: #ff6b6b; }

    .avatar-edit { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .avatar-preview {
        width: 80px; height: 80px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 28px;
        flex-shrink: 0; overflow: hidden; border: 3px solid #444;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

    .drop-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .drop-form .full-width { grid-column: 1 / -1; }
    @media (max-width: 600px) { .drop-form { grid-template-columns: 1fr; } }

    .case-custom-input { display: none; margin-top: 8px; }
    .case-custom-input.visible { display: block; }

    /* ЧАТ */
    .chat-container {
        width: 100%; max-width: 600px;
        background: #2a2a3e; border-radius: 12px;
        overflow: hidden; display: flex; flex-direction: column;
        height: 70vh;
    }
    .chat-header {
        background: #764ba2; padding: 12px 20px;
        font-weight: 700; font-size: 16px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .chat-status { font-size: 12px; color: #e0d4ff; }
    .chat-messages {
        flex: 1; overflow-y: auto; padding: 15px;
        display: flex; flex-direction: column; gap: 10px;
    }
    .chat-msg {
        background: #35354d; padding: 10px 14px;
        border-radius: 12px; max-width: 80%;
        align-self: flex-start; position: relative;
        display: flex; gap: 10px;
    }
    .chat-msg.own { background: #764ba2; align-self: flex-end; }
    .chat-msg .msg-avatar {
        width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 13px;
        overflow: hidden; flex-shrink: 0;
    }
    .chat-msg .msg-avatar.mega { background: linear-gradient(135deg, #ff6b6b, #c62828); }
    .chat-msg .msg-avatar.sergo { background: linear-gradient(135deg, #4fc3f7, #0288d1); }
    .chat-msg .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-msg .msg-body { flex: 1; min-width: 0; }
    .chat-msg .msg-author {
        font-size: 11px; font-weight: 700;
        margin-bottom: 4px; color: #a78bfa;
    }
    .chat-msg.own .msg-author { color: #e0d4ff; }
    .chat-msg .msg-text { font-size: 14px; word-break: break-word; }
    .chat-msg .msg-time { font-size: 10px; color: #888; margin-top: 4px; text-align: right; }
    .msg-delete {
